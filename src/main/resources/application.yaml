spring:
  application:
    name: akriti
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  address: 0.0.0.0
  port: ${PORT}
  servlet:
    context-path: /api/v1


# custom properties
application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000 # 1 hour in ms