spring:
  application:
    name: akriti
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akriti}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

# custom properties
application:
  security:
    admin:
      email: ${ADMIN_EMAIL:admin@gmail.com}
      password: ${ADMIN_PASSWORD:admin@123}
    jwt:
      secret: ${JWT_SECRET:gauravisgoodboy}
      expiration: 3600000 # 1 hour in ms

